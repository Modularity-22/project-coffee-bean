# Words roasters print on bags that are not flavour-wheel terms, and the wheel
# term each one is recorded as. Used by the scraper and by the validator's
# suggestions. The roaster's own wording is always kept in `roaster_notes`.
#
# Rule of thumb: map to the closest wheel term, and go up a level rather than
# pick a specific term that is not really what the roaster said. Mango is not
# "pineapple"; it is "other-fruit".
#
# A word mapped to `null` is a texture or impression, not a flavour (creamy,
# juicy, clean). It stays in `roaster_notes` and is left out of `flavor_notes`.

