# The only flavour terms allowed in `flavor_notes`, for beans and for drinks.
#
# Structure and terms follow the Coffee Taster's Flavor Wheel (Specialty Coffee
# Association and World Coffee Research, 2016), as published in:
#   Spencer M., Sage E., Velez M., Guinard J.-X. (2016). "Using Single Free
#   Sorting and Multivariate Exploratory Methods to Design a New Coffee Taster's
#   Flavor Wheel." Journal of Food Science 81(12): S2997–S3005, Table 4.
# The wheel's artwork is not reproduced here. See docs/flavour-vocabulary.md.
#
# Three tiers: category > group > descriptor. A note may use any tier: when you
# cannot place a taste exactly, use the broader term ("berry" rather than
# guessing "raspberry"). Where the wheel repeats a name one level down (Floral >
# Floral, Green/vegetative > Green/vegetative) the repeated level is folded into
# its parent. Ids are permanent.
#
# Words roasters use that are not on the wheel (jaggery, mango, cardamom...) are
# mapped in flavor-aliases.yaml. Never add a term to this file to fit one coffee.

- id: floral
  name: Floral
  children:
    - { id: black-tea, name: Black tea }
    - { id: chamomile, name: Chamomile }
    - { id: rose, name: Rose }
    - { id: jasmine, name: Jasmine }

- id: fruity
  name: Fruity
  children:
    - id: berry
      name: Berry
      children:
        - { id: blackberry, name: Blackberry }
        - { id: raspberry, name: Raspberry }
        - { id: blueberry, name: Blueberry }
        - { id: strawberry, name: Strawberry }
    - id: dried-fruit
      name: Dried fruit
      children:
        - { id: raisin, name: Raisin }
        - { id: prune, name: Prune }
    - id: other-fruit
      name: Other fruit
      children:
        - { id: coconut, name: Coconut }
        - { id: cherry, name: Cherry }
        - { id: pomegranate, name: Pomegranate }
        - { id: pineapple, name: Pineapple }
        - { id: grape, name: Grape }
        - { id: apple, name: Apple }
        - { id: peach, name: Peach }
        - { id: pear, name: Pear }
    - id: citrus-fruit
      name: Citrus fruit
      children:
        - { id: grapefruit, name: Grapefruit }
        - { id: orange, name: Orange }
        - { id: lemon, name: Lemon }
        - { id: lime, name: Lime }

- id: sour-fermented
  name: Sour / fermented
  children:
    - id: sour
      name: Sour
      children:
        - { id: sour-aromatics, name: Sour aromatics }
        - { id: acetic-acid, name: Acetic acid }
        - { id: butyric-acid, name: Butyric acid }
        - { id: isovaleric-acid, name: Isovaleric acid }
        - { id: citric-acid, name: Citric acid }
        - { id: malic-acid, name: Malic acid }
    - id: alcohol-fermented
      name: Alcohol / fermented
      children:
        - { id: winey, name: Winey }
        - { id: whiskey, name: Whiskey }
        - { id: fermented, name: Fermented }
        - { id: overripe, name: Overripe }

- id: green-vegetative
  name: Green / vegetative
  children:
    - { id: olive-oil, name: Olive oil }
    - { id: raw, name: Raw }
    - { id: under-ripe, name: Under-ripe }
    - { id: peapod, name: Peapod }
    - { id: fresh, name: Fresh }
    - { id: dark-green, name: Dark green }
    - { id: vegetative, name: Vegetative }
    - { id: hay-like, name: Hay-like }
    - { id: herb-like, name: Herb-like }
    - { id: beany, name: Beany }

- id: other
  name: Other
  children:
    - id: papery-musty
      name: Papery / musty
      children:
        - { id: stale, name: Stale }
        - { id: cardboard, name: Cardboard }
        - { id: papery, name: Papery }
        - { id: woody, name: Woody }
        - { id: moldy-damp, name: Moldy / damp }
        - { id: musty-dusty, name: Musty / dusty }
        - { id: musty-earthy, name: Musty / earthy }
        - { id: animalic, name: Animalic }
