name: Data correction
description: Something in the database is wrong, out of date, or should be removed.
title: 'data: fix <company or bean>'
labels: [data, correction]
body:
  - type: input
    id: entry
    attributes:
      label: Which entry?
      description: Company and, if relevant, bean, cafe or drink.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong, and what should it say?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link that shows the correct information.
      placeholder: https://
  - type: checkboxes
    id: company
    attributes:
      label: About you
      options:
        - label: I represent this company.
