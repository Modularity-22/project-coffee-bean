name: Bug report
description: The app or a tool does not work as expected.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        [
          'Mobile app (Android)',
          'Mobile app (iOS)',
          'Build tools',
          'Schema or generated database',
          'Knowledge graph export',
          'Other',
        ]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version, or commit, plus device/OS or Node.js version.
